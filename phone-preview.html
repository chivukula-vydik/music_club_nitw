<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;gap:16px;flex-direction:column;align-items:center;justify-content:center;background:#1a1a1a;font:14px system-ui,sans-serif;color:#aaa}
  .phone{width:390px;height:844px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);border:12px solid #000;border-radius:44px;overflow:hidden;box-shadow:0 0 0 2px #333,0 20px 60px #000}
  iframe{width:100%;height:100%;border:0;display:block}
  button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:#ddd;cursor:pointer}
</style>
<div class="phone"><iframe id="f"></iframe></div>
<button onclick="load()">Replay popup</button>
<script>
  // the popup only shows once per browser; clear its flag so the preview always shows it
  function load(){try{localStorage.removeItem('mc-obl-cancel-seen')}catch(_){}f.src='Music Club NITW.dc.html?'+Date.now()}
  load();
</script>

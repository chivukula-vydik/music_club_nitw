# ponytail: Vercel Hobby crons are daily-only, so GitHub pings the reminder endpoint instead.
# GitHub may delay scheduled runs by a few minutes and pauses them after 60 days without repo activity.
name: reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://music-club-nitw.vercel.app/api/notify-events

<script>
/* ============ EDIT ANNOUNCEMENTS HERE (newest first) ============ */
const ANNOUNCEMENTS = [
  { tag:'Auditions', date:'06 Sep 2026', live:false, title:'Core & Tech Team Auditions Are Open!',
    body:'Registration is live for both Core Team (Vocals, Band, Classical, Production) and Tech Team (Graphics, Video, Photo, Stage). Deadline extended to 14 Sept! Auditions run 15-18 Sept. All years welcome.' },
  { tag:'Event', date:'28 Aug 2026', live:false, title:'Freshers Event — 30 Aug, 6 PM',
    body:'Welcome batch of 2030! Join us at the Student Activity Centre for an evening of live music, introductions, and good vibes. Open to all freshers.' },
  { tag:'Jam Night', date:'05 Aug 2026', live:false, title:'Jam Night 1 Wrap-Up',
    body:'First jam night of the semester went off. Thanks to everyone who showed up and played. Next one on 11 Sept — bring your instruments.' },
  { tag:'General', date:'01 Aug 2026', live:false, title:'Welcome Back — Sem 1 2026-27',
    body:'New semester, new lineup. Keep an eye on this page and our Instagram for all updates on events, workshops, and auditions this semester.',
    link:'https://www.instagram.com/musicclubdenitw/', linkText:'Follow us' },
];
/* ================================================================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(href,text,cls)=>href?`<a class="btn ${cls}" href="${esc(href)}" target="_blank" rel="noopener">${esc(text||'Open')} &rarr;</a>`:'';
document.getElementById('feed').innerHTML = ANNOUNCEMENTS.map(a=>`<article class="post">
  <div class="meta"><span class="tag">${esc(a.tag)}</span><span class="date">${esc(a.date)}</span>${a.live?'<span class="live">LIVE</span>':''}</div>
  <h3>${esc(a.title)}</h3><p>${esc(a.body)}</p>
  ${a.link||a.link2?`<div class="links">${btn(a.link,a.linkText,'red')}${btn(a.link2,a.linkText2,'')}</div>`:''}
</article>`).join('');
</script>
